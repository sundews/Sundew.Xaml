name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - "release*"
  pull_request:

concurrency:
  group: ${{ github.ref == 'refs/tags/release' && github.ref || github.run_id }}

jobs:
  build:
    name: .NET
    runs-on: windows-latest
    env:
      solutionDir: ./Source
      solutionPath: ./Source/Sundew.Xaml.slnx
      primitivesTestsPath: ./Sundew.Xaml.Controls.Primitives.Tests/Sundew.Xaml.Controls.Primitives.Tests.csproj
      wpfTestsPath: ./Sundew.Xaml.Development.Tests/Sundew.Xaml.Wpf.Development.Tests.csproj
      versioningProjectPath: ./Source/Sundew.Xaml.Controls.Wpf/Sundew.Xaml.Controls.Wpf.csproj
      repository: 'https://sundew-dev:${{ secrets.SUNDEW_DEV_TOKEN }}@github.com/sundews/Sundew.Xaml.git'
      source: 'https://api.nuget.org/v3/index.json'
      dev-source: 'https://www.myget.org/F/sundew-dev/api/v2/package'
      dev-source-latest-version: 'https://www.myget.org/F/sundew-dev/api/v3/index.json'
      dev-symbols-source: 'https://www.myget.org/F/sundew-dev/api/v3/index.json'
      packages-to-push: 'logs/packages.push'
      source-packages-to-push: './Source/logs/packages.push'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup .NET preview
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x.x
        dotnet-quality: preview
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
            9.x.x
            8.x.x
    - name: Build setup
      id: build-setup
      run: >
        dotnet tool update Sundew.Packaging.Tool -g --version 8.10.*

        dotnet tool update CommandlineBatcher -g --version 8.6.*

        git rev-parse --short=10 HEAD | cb -c ">> $Env:GITHUB_OUTPUT|git-hash={0}{NL}" --batches-stdin

        cb match -p "(?<Input>^(?!(refs/pull.*|refs/heads/$)).+) => git-branch-name={Input}" -i "refs/heads/${{ github.base_ref }}" "${{ github.ref }}" -of $Env:GITHUB_OUTPUT
        
        git log -1 --pretty=%B > git_commit_message.txt
    - name: Stage Build
      id: stage-build
      run: >
        spt stage-build --project-file "${{ env.versioningProjectPath }}"
        --production  "refs/(heads/release/.+|tags/release)                                  => ${{ secrets.SPP_API_KEY }}@${{ env.source }}|${{ env.source }}||Configuration=Release"
        --integration "refs/heads/(?:master|main).*                                          => &u{DateTime}-{Stage} ${{ secrets.SPP_API_KEY }}@${{ env.source }}|${{ env.source }}||Configuration=Debug|DevFeedSource= -s ${{ env.dev-source-latest-version }}"
        --development "refs/heads/(?:develop.*|feature/(?<Postfix>.+)|bugfix/(?<Postfix>.+)) => ${{ secrets.SPP_DEVELOPMENT_API_KEY }}@${{ env.dev-source }} {${{ env.dev-source-latest-version }}}|${{ secrets.SPP_DEVELOPMENT_API_KEY }}@${{ env.dev-symbols-source }}||Configuration=Debug|DevFeedSource= -s ${{ env.dev-source-latest-version }}"
        --no-stage "Configuration=Release"
        --stage "${{ github.ref }}"
        --build-promotion-input "< git_commit_message.txt"
        --build-promotion-regex "=>\s*release"
        --prerelease-format "u{DateTime}-{Stage}-{Postfix}"
        --metadata ${{ steps.build-setup.outputs.git-hash }}
        --force-version '"${{ secrets.SPP_FORCE_VERSION_IF_SET }}"'
        --output-formats "Selected stage: {Stage}, {FullVersion}, {Configuration}" ">|stage={Stage}{NL}" ">|version={Version}{NL}" ">|buildConfiguration={Configuration}{NL}"
        ">|nuGetPackagesPath={WorkingDirectory}/NuGet{NL}" ">|dev-package-source-if-set={DevFeedSource}{NL}" ">|feedSource={FeedSource}{NL}"
        ">|pushSource={PushSource}{NL}" ">|apiKey={ApiKey}{NL}" ">|fullVersion={FullVersion}{NL}" ">|symbolsPushSource={SymbolsPushSource}{NL}"
        ">|symbolsApiKey={SymbolsApiKey}{NL}" ">|buildPromotion={BuildPromotion}"
        --output-file $Env:GITHUB_OUTPUT
    - name: 'Remove release tag'
      if: ${{ steps.stage-build.outputs.stage == 'production' && steps.stage-build.outputs.buildPromotion != 'promoted' }}
      run: git push --delete ${{ env.repository }} ${{ github.ref }}
    - name: Restore
      run: dotnet restore ${{ env.solutionPath }} --verbosity normal -p:SundewUnoAllHeads=false -p:SundewAvaloniaAllHeads=false -s ${{ env.source }}${{ steps.stage-build.outputs.dev-package-source-if-set }}
    - name: Build
      id: build
      run: >
        dotnet build ${{ env.solutionPath }} --verbosity normal --configuration ${{ steps.stage-build.outputs.buildConfiguration }} --no-restore
        -p:"ContinuousIntegrationBuild=true"
        -p:"SundewUnoAllHeads=false"
        -p:"SundewAvaloniaAllHeads=false"
        -p:"SppForceVersion=${{ steps.stage-build.outputs.fullVersion }}"
        '-p:"SppAppendPublishFileLogFormats={PackageId}={DQ}{PackagePath}{DQ}={Version}{NL} > ${{ env.packages-to-push }}"'
        -p:GeneratePackageOnBuild=true
        -p:"PackageOutputPath=${{ steps.stage-build.outputs.nuGetPackagesPath }}"
    # The test projects are named rather than discovered with --solution, because that makes dotnet test
    # evaluate every project in the solution, the Uno tester included, whose Uno.Sdk it fails to resolve on a
    # build agent. Run from the solution directory so that global.json, and so the Microsoft.Testing.Platform
    # runner it selects, is still found.
    - name: Test controls primitives
      working-directory: ${{ env.solutionDir }}
      run: >
        dotnet test ${{ env.primitivesTestsPath }}
        --verbosity normal --configuration ${{ steps.stage-build.outputs.buildConfiguration }} --no-build
        -p:SundewUnoAllHeads=false -p:SundewAvaloniaAllHeads=false
    - name: Test WPF development
      working-directory: ${{ env.solutionDir }}
      run: >
        dotnet test ${{ env.wpfTestsPath }}
        --verbosity normal --configuration ${{ steps.stage-build.outputs.buildConfiguration }} --no-build
        -p:SundewUnoAllHeads=false -p:SundewAvaloniaAllHeads=false
    - name: 'Publish package(s)'
      if: ${{ steps.stage-build.outputs.stage != 'none' }}
      run: cb -c "spt|push -s ${{ steps.stage-build.outputs.pushSource }} -k ${{ steps.stage-build.outputs.apiKey }} -ss ${{ steps.stage-build.outputs.symbolsPushSource }} -sk ${{ steps.stage-build.outputs.symbolsApiKey }} --retries 10 {1}" -bs NewLine -bvs '=' -bf ${{ env.source-packages-to-push }}
    - name: 'Tag stable version'
      if: ${{ steps.stage-build.outputs.stage == 'production' }}
      run: |
        git config user.email "${{ secrets.BUILD_EMAIL }}"
        git config user.name "${{ secrets.BUILD_USERNAME }}"
        git tag -a v.${{ steps.stage-build.outputs.version }} -m "v.${{ steps.stage-build.outputs.version }}"
        git push ${{ env.repository }} v.${{ steps.stage-build.outputs.version }}
    - name: 'Await stable package publish'
      if: ${{ steps.stage-build.outputs.stage == 'production' }}
      run: cb -c "spt|await -s ${{ steps.stage-build.outputs.feedSource }} {0}.{2}" -bs NewLine -bvs '=' -bf ${{ env.source-packages-to-push }}
    - name: 'Summary'
      run: |
        echo '### Pushed version: ${{ steps.stage-build.outputs.fullVersion }}' >> $GITHUB_STEP_SUMMARY

  heads:
    name: .NET Android and WebAssembly heads
    runs-on: windows-latest
    # The heads the main job leaves out. They need the android and wasm-tools workloads, which a plain build
    # agent does not have and which cost a few minutes to install, so they are built on main and release
    # rather than on every push. Nothing is packed or published here: SppDisable keeps Sundew.Packaging.Publish
    # out of it, so this job only answers whether the heads still compile.
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/release') }}
    env:
      unoTesterPath: ./Source/Sundew.Xaml.Uno.Development.Tester
      avaloniaTesterPath: ./Source/Sundew.Xaml.Avalonia.Development.Tester
      headsBuild: --configuration Debug --verbosity normal -p:SppDisable=true
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup .NET preview
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x.x
        dotnet-quality: preview
    - name: Install workloads
      run: dotnet workload install android wasm-tools
    - name: Build Uno Android head
      run: dotnet build ${{ env.unoTesterPath }} ${{ env.headsBuild }} -f net10.0-android -p:SundewUnoAllHeads=true
    - name: Build Uno WebAssembly head
      run: dotnet build ${{ env.unoTesterPath }} ${{ env.headsBuild }} -f net10.0-browserwasm -p:SundewUnoAllHeads=true
    - name: Build Avalonia Android head
      run: dotnet build ${{ env.avaloniaTesterPath }} ${{ env.headsBuild }} -f net10.0-android -p:SundewAvaloniaAllHeads=true
