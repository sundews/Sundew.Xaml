<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sundew.Xaml Avalonia Tester</title>
    <link rel="modulepreload" href="./main.js" />
    <!--
      The host div has to be given a size. Avalonia lays the sheet out into whatever this element measures, and a
      bare div is zero high however big the canvas inside it looks: the canvas is absolutely positioned, so it
      fills the viewport while the div it reports its size from stays empty, and the page comes up blank.
    -->
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #out { position: relative; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="out"></div>
    <script type="module" src="./main.js"></script>
</body>
</html>
